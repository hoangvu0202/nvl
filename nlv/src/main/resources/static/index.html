<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 User Management Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.29/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        #app {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            margin-right: 10px;
        }
        button:hover {
            background: #764ba2;
        }
        .list-section {
            margin-top: 30px;
        }
        .user-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info h3 {
            margin: 5px 0;
            color: #333;
        }
        .user-info p {
            color: #666;
            font-size: 14px;
        }
        .btn-delete {
            background: #ff6b6b;
            padding: 8px 15px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background: #ff5252;
        }
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .success {
            background: #e0ffe0;
            color: #388e3c;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>👥 Vue 3 + Spring Boot REST API Demo</h1>

        <div v-if="message" :class="messageType">{{ message }}</div>

        <div class="form-section">
            <h2>Add New User</h2>
            <form @submit.prevent="addUser">
                <div class="form-group">
                    <label>Name:</label>
                    <input v-model="form.name" type="text" placeholder="Enter user name" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input v-model="form.email" type="email" placeholder="Enter user email" required>
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input v-model.number="form.age" type="number" placeholder="Enter user age" required>
                </div>
                <button type="submit">Add User</button>
                <button type="button" @click="resetForm">Reset</button>
            </form>
        </div>

        <div class="list-section">
            <h2>Users List</h2>
            <div v-if="loading" class="loading">Loading users...</div>
            <div v-else-if="users.length === 0" style="text-align: center; color: #999; padding: 20px;">
                No users found. Create one to get started!
            </div>
            <div v-else>
                <div v-for="user in users" :key="user.id" class="user-card">
                    <div class="user-info">
                        <h3>#{{ user.id }} - {{ user.name }}</h3>
                        <p>📧 {{ user.email }}</p>
                        <p>📅 Age: {{ user.age }}</p>
                    </div>
                    <button class="btn-delete" @click="deleteUser(user.id)">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    users: [],
                    form: {
                        name: '',
                        email: '',
                        age: null
                    },
                    message: '',
                    messageType: '',
                    loading: false
                };
            },
            methods: {
                async fetchUsers() {
                    this.loading = true;
                    try {
                        const response = await fetch('/api/users');
                        if (response.ok) {
                            this.users = await response.json();
                        } else {
                            this.showMessage('Failed to fetch users', 'error');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        this.showMessage('Error fetching users: ' + error.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },
                async addUser() {
                    try {
                        const response = await fetch('/api/users', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.form)
                        });
                        if (response.ok) {
                            this.showMessage('User added successfully!', 'success');
                            this.resetForm();
                            await this.fetchUsers();
                        } else {
                            this.showMessage('Failed to add user', 'error');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        this.showMessage('Error adding user: ' + error.message, 'error');
                    }
                },
                async deleteUser(id) {
                    if (confirm('Are you sure you want to delete this user?')) {
                        try {
                            const response = await fetch(`/api/users/${id}`, {
                                method: 'DELETE'
                            });
                            if (response.ok) {
                                this.showMessage('User deleted successfully!', 'success');
                                await this.fetchUsers();
                            } else {
                                this.showMessage('Failed to delete user', 'error');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            this.showMessage('Error deleting user: ' + error.message, 'error');
                        }
                    }
                },
                resetForm() {
                    this.form = {
                        name: '',
                        email: '',
                        age: null
                    };
                },
                showMessage(msg, type) {
                    this.message = msg;
                    this.messageType = type;
                    setTimeout(() => {
                        this.message = '';
                    }, 3000);
                }
            },
            mounted() {
                this.fetchUsers();
            }
        }).mount('#app');
    </script>
</body>
</html>
